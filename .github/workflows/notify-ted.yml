name: Notify TED update

on:
  push:
    branches: [main]
    paths:
      - 'TED每日精读/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ted-notification
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the update
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate notification formatting
        run: python -m unittest discover -s tests -p 'test_notify_ted.py' -v

      - name: Wait for Pages and send notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/notify_ted.py
