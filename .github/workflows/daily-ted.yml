name: Daily TED reading

on:
  schedule:
    # GitHub cron is UTC. 00:00 UTC = 08:00 Asia/Shanghai.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional backfill date (YYYY-MM-DD); empty means today in Shanghai'
        required: false
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-ted
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install website dependency
        run: python -m pip install -r scripts/requirements-pages.txt

      - name: Check generator validation rules
        run: python -m unittest discover -s tests -v

      - name: Generate and validate daily lesson
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TED_MODEL: ${{ vars.TED_MODEL || 'gpt-5-mini' }}
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            python scripts/daily_ted.py --date "$REQUESTED_DATE"
          else
            python scripts/daily_ted.py
          fi

      - name: Rebuild mobile website
        run: python scripts/build_pages.py

      - name: Commit and push generated files
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- TED每日精读 docs
          if ! git diff --cached --quiet; then
            git commit -m "Update daily TED reading $(TZ=Asia/Shanghai date +%F)"
            # Never force push. Concurrent manual edits cause a clear failure instead of overwriting work.
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request and verify Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          # A push made with GITHUB_TOKEN does not trigger the normal Pages build.
          # Explicitly request a build from the existing main /docs Pages source.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
          for attempt in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > "$RUNNER_TEMP/ted-pages-build.json"
            state=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/ted-pages-build.json")
            deployed_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("commit", ""))' "$RUNNER_TEMP/ted-pages-build.json")
            if [ "$deployed_sha" = "$EXPECTED_COMMIT" ] && [ "$state" = 'built' ]; then
              echo "Published commit $EXPECTED_COMMIT to GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$deployed_sha" = "$EXPECTED_COMMIT" ] && [ "$state" = 'errored' ]; then
              echo 'GitHub Pages build failed. Inspect the Pages build logs.' >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for the matching GitHub Pages deployment.' >&2
          exit 1
